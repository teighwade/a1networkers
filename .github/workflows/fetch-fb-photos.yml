name: Fetch Facebook photos (one-time)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download public page photos
        run: |
          mkdir -p fb
          IDS="122132761485338362 122132182095338362 122132182035338362 122132182011338362 122132181945338362 122132181915338362 122132181867338362 122132181831338362 122132181777338362 122132181753338362 122132181711338362 122132181645338362 122132181621338362 122132181561338362 122132181537338362 122132181477338362 122132181453338362 122130747471338362 122130747411338362 122130747387338362 122130747327338362 122130747309338362 122130747243338362 122130747219338362 122130747159338362 122130747129338362 122130747075338362 122130747051338362 122129519145338362 122129519121338362 122129519091338362 122129519013338362 122129519001338362 122129518989338362 122115894681338362 122115894651338362 122109198279338362 122109198249338362 122109198207338362 122109198165338362 122109198123338362 122109198081338362 122109198033338362 122109197991338362 122109197955338362 122109197913338362 122109197865338362 122109197823338362 122109197781338362 122109197745338362 122108934321338362 122108934255338362 122105175081338362 122105175051338362 122105174979338362 122105174949338362 122100908703338362 122100320637338362 122094002277338362 122094000177338362 122093998791338362"
          UA="facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
          for id in $IDS; do
            html=$(curl -sL -A "$UA" "https://www.facebook.com/photo/?fbid=$id" || true)
            img=$(printf '%s' "$html" | grep -o '<meta property="og:image" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//; s/&amp;/\&/g')
            if [ -n "$img" ]; then curl -sL -A "$UA" -o "fb/$id.jpg" "$img" && echo "$id ok $(stat -c%s fb/$id.jpg)"; else echo "$id no-image"; fi
          done
          ls fb | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: fb-photos
          path: fb/
