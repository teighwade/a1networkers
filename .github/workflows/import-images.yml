name: Import photos from the old WordPress site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/import-wp-images.mjs']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/import-wp-images.mjs
      - run: |
          git add public/img
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "A1 Networkers bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Import photos from the old WordPress site"
          git pull --rebase
          git push
